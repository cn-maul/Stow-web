<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stow Core - 库存管理</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --success: #16a34a;
    --success-hover: #15803d;
    --warning: #d97706;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .health-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 999px; font-size: 13px;
    background: #fee2e2; color: var(--danger);
  }
  .health-badge.ok { background: #dcfce7; color: var(--success); }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 200px; }
  .search-box input {
    width: 100%; padding: 8px 14px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; outline: none;
    transition: border-color .15s;
  }
  .search-box input:focus { border-color: var(--primary); }
  .toolbar select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; outline: none; background: var(--surface); cursor: pointer;
    min-width: 120px;
  }
  .toolbar select:focus { border-color: var(--primary); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover:not(:disabled) { background: var(--success-hover); }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-warning:hover:not(:disabled) { background: #b45309; }
  .btn-outline {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  .btn-outline:hover { background: var(--bg); }
  .btn-sm { padding: 4px 10px; font-size: 13px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .card-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 15px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #f8fafc; font-weight: 600; color: var(--text-secondary); font-size: 13px; }
  tr:hover td { background: #f8fafc; }
  tr:last-child td { border-bottom: none; }
  .empty { text-align: center; padding: 48px 24px; color: var(--text-secondary); }
  .empty p { margin-top: 8px; font-size: 14px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); z-index: 100;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface); border-radius: 16px;
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
  }
  .modal-header {
    padding: 20px 24px 0; display: flex; align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 { font-size: 18px; }
  .modal-close {
    background: none; border: none; font-size: 24px; cursor: pointer;
    color: var(--text-secondary); padding: 4px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px 24px; }
  .modal-footer {
    padding: 0 24px 20px; display: flex; gap: 8px; justify-content: flex-end;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 4px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; outline: none;
    transition: border-color .15s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: var(--primary);
  }
  .form-group textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  .toast-container { position: fixed; top: 16px; right: 16px; z-index: 200; }
  .toast {
    padding: 12px 20px; border-radius: 10px; font-size: 14px;
    margin-bottom: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.1);
    animation: slideIn .3s ease;
  }
  .toast-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .toast-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .item-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  .item-detail-grid .field-label { font-size: 13px; color: var(--text-secondary); }
  .item-detail-grid .field-value { font-size: 15px; font-weight: 500; margin-bottom: 12px; }
  .stock-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .stock-count { font-size: 28px; font-weight: 700; color: var(--primary); }
  .movements-table { margin-top: 20px; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .primary-tabs { background: var(--surface); padding: 0 max(24px, calc((100% - 1200px) / 2)); }
  .manage-tabs { margin-bottom: 20px; gap: 4px; }
  .tab {
    padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-secondary); border-bottom: 2px solid transparent;
    transition: all .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .health-check { display: flex; align-items: center; gap: 8px; }
  .loc-card { margin-bottom: 16px; }
  .loc-card .card-header { background: #f1f5f9; }
  .loc-item-row { display: flex; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); }
  .loc-item-row:last-child { border-bottom: none; }
  .loc-item-row:hover { background: #f8fafc; }
  .loc-item-name { flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loc-item-meta { color: var(--text-secondary); font-size: 12px; font-weight: 400; margin-top: 2px; }
  .loc-item-exp { margin: 0 12px; font-size: 13px; color: var(--text-secondary); min-width: 90px; }
  .loc-item-exp.expired { color: var(--danger); font-weight: 600; }
  .loc-item-qty { margin: 0 12px; font-weight: 600; color: var(--primary); min-width: 40px; text-align: right; }

  .loc-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .loc-batch-row { padding: 0 20px 12px; background: #f8fafc; border-bottom: 1px solid var(--border); }
  .loc-batch-row:last-child { border-bottom: none; }
  .batch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .batch-table th, .batch-table td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .batch-table th { background: transparent; color: var(--text-secondary); font-weight: 500; font-size: 12px; }
  .mov-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .mov-row:last-child { border-bottom: none; }
  .mov-type { font-size: 16px; min-width: 20px; text-align: center; }
  .mov-qty { font-weight: 600; min-width: 50px; text-align: right; }
  .mov-qty.up { color: var(--success); }
  .mov-qty.down { color: var(--danger); }
  .mov-qty.adjust { color: var(--warning); }
  .mov-note { flex: 1; color: var(--text-secondary); }
  .mov-time { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
  @media (max-width: 768px) {
    .header { padding: 12px 14px; }
    .header h1 { font-size: 18px; }
    .header-actions { gap: 6px; }
    .health-badge { padding: 3px 8px; font-size: 12px; }
    .primary-tabs { padding: 0 8px; position: sticky; top: 57px; z-index: 9; }
    .primary-tabs .tab { flex: 1; text-align: center; }
    .manage-tabs { overflow-x: auto; white-space: nowrap; }
    .manage-tabs .tab { flex: 1; min-width: 96px; text-align: center; padding-inline: 12px; }
    .container { padding: 12px; }
    .toolbar { gap: 8px; margin-bottom: 12px; }
    .search-box { flex-basis: 100%; }
    .toolbar select { flex: 1; min-width: 0; }
    .toolbar .btn { min-height: 38px; }
    .card { border-radius: 10px; }
    .table-wrap { -webkit-overflow-scrolling: touch; }
    .table-wrap > table { min-width: 720px; }
    .management-table { min-width: 0 !important; }
    .management-table thead { display: none; }
    .management-table tbody, .management-table tr { display: block; width: 100%; box-sizing: border-box; }
    .management-table tr { padding: 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .management-table tr:last-child { border-bottom: none; }
    .management-table td { display: inline; padding: 0; border: 0; background: transparent !important; font-size: 13px; line-height: 1.6; }
    .management-table td.cell-title { display: block; font-weight: 600; font-size: 15px; }
    .management-table td.cell-meta { color: var(--text-secondary); }
    .management-table td.cell-meta + td.cell-meta::before { content: ' · '; }
    .management-table td.cell-stock { display: block; font-weight: 700; font-size: 18px; color: var(--primary); margin-top: 4px; }
    .management-table td.cell-stock.low { color: var(--danger); }
    .management-table td.cell-ops { display: flex; gap: 8px; margin-top: 10px; }
    .management-table td.cell-ops .btn { flex: 1; justify-content: center; min-height: 36px; }
    .item-detail-grid { grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .stock-actions .btn { flex: 1; justify-content: center; min-width: 84px; }
    .form-row { flex-direction: column; gap: 0; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal { max-width: none; max-height: 92vh; border-radius: 16px 16px 0 0; }
    .modal-body { padding: 16px 18px; }
    .modal-header { padding: 16px 18px 0; }
    .modal-footer { padding: 0 18px 16px; }
    .modal-footer .btn { flex: 1; justify-content: center; min-height: 42px; }
    .loc-card { margin-bottom: 12px; }
    .loc-item-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 14px; }
    .loc-item-name { font-size: 15px; }
    .loc-item-exp { grid-column: 1; margin: 0; min-width: 0; }
    .loc-item-exp::before { content: '最近到期 '; color: var(--text-secondary); }
    .loc-item-qty { grid-column: 2; grid-row: 1; margin: 0; min-width: 0; font-size: 16px; }
    .loc-item-actions { grid-column: 1 / -1; margin-top: 4px; }
    .loc-item-actions .btn { flex: 1; justify-content: center; min-height: 36px; }
    .loc-batch-row { padding: 0 10px 10px; overflow-x: auto; }
    .batch-table { min-width: 520px; }
    .toast-container { left: 12px; right: 12px; top: 12px; }
    .toast { width: 100%; }
  }

  @media (max-width: 420px) {
    .header h1 { font-size: 17px; }
    .item-detail-grid { grid-template-columns: 1fr; }
    .primary-tabs .tab { padding: 9px 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Stow Core</h1>
  <div class="header-actions">
    <span class="health-badge" id="healthBadge">● 检查中...</span>
    <button class="btn btn-primary btn-sm" id="headerCreateBtn" onclick="onCreate()" style="display:none">+ 新建物品</button>
  </div>
</div>

<div class="tabs primary-tabs">
  <div class="tab active" data-page="home" onclick="switchPage('home')">首页</div>
  <div class="tab" data-page="manage" onclick="switchPage('manage')">管理</div>
</div>

<div class="container">

  <div id="pageHome">
    <div class="toolbar">
      <button class="btn btn-outline" onclick="loadLocationItems()">刷新</button>
    </div>
    <div id="locationItemsContent"></div>
  </div>

  <div id="pageManage" style="display:none">
    <div class="tabs manage-tabs">
      <div class="tab active" data-manage-tab="items" onclick="switchManageTab('items')">物品管理</div>
      <div class="tab" data-manage-tab="categories" onclick="switchManageTab('categories')">分类管理</div>
      <div class="tab" data-manage-tab="locations" onclick="switchManageTab('locations')">位置管理</div>
    </div>

  <div id="tabItems">
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索物品名称..." oninput="renderItems()">
      </div>
      <select id="filterCategory" onchange="renderItems()"><option value="">全部分类</option></select>
      <select id="filterLocation" onchange="renderItems()"><option value="">全部位置</option></select>
      <button class="btn btn-outline" onclick="loadItems()">刷新</button>
    </div>

    <div class="card">
      <div class="card-header">
        <span>物品列表</span>
        <span style="font-weight:400;font-size:13px;color:var(--text-secondary)" id="itemCount">0 项</span>
      </div>
      <div class="table-wrap">
        <table class="management-table">
          <thead>
            <tr>
              <th>名称</th>
              <th>分类</th>
              <th>位置</th>
              <th style="width:80px">库存</th>
              <th style="width:200px">操作</th>
            </tr>
          </thead>
          <tbody id="itemTableBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState">
        <div style="font-size:40px;color:var(--border);margin-bottom:8px">📦</div>
        <p>暂无物品，点击右上角「新建物品」开始</p>
      </div>
    </div>

    <div class="card" id="detailCard" style="display:none;margin-top:20px">
      <div class="card-header">
        <span id="detailTitle">物品详情</span>
        <button class="btn btn-outline btn-sm" onclick="hideDetail()">关闭</button>
      </div>
      <div class="card-body" style="padding:20px">
        <div id="detailContent"></div>
      </div>
    </div>
  </div>

  <div id="tabCategories" style="display:none">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="showCategoryModal()">+ 新建分类</button>
      <button class="btn btn-outline" onclick="loadCategories()">刷新</button>
    </div>
    <div class="card">
      <div class="card-header">
        <span>分类列表</span>
        <span style="font-weight:400;font-size:13px;color:var(--text-secondary)" id="categoryCount">0 项</span>
      </div>
      <div class="table-wrap">
        <table class="management-table">
          <thead>
            <tr><th>名称</th><th style="width:160px">操作</th></tr>
          </thead>
          <tbody id="categoryTableBody"></tbody>
        </table>
      </div>
      <div class="empty" id="categoryEmpty">
        <div style="font-size:40px;color:var(--border);margin-bottom:8px">🏷️</div>
        <p>暂无分类，点击上方「新建分类」创建</p>
      </div>
    </div>
  </div>

  <div id="tabLocations" style="display:none">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="showLocationModal()">+ 新建位置</button>
      <button class="btn btn-outline" onclick="loadLocations()">刷新</button>
    </div>
    <div class="card">
      <div class="card-header">
        <span>位置列表</span>
        <span style="font-weight:400;font-size:13px;color:var(--text-secondary)" id="locationCount">0 项</span>
      </div>
      <div class="table-wrap">
        <table class="management-table">
          <thead>
            <tr><th>名称</th><th style="width:160px">操作</th></tr>
          </thead>
          <tbody id="locationTableBody"></tbody>
        </table>
      </div>
      <div class="empty" id="locationEmpty">
        <div style="font-size:40px;color:var(--border);margin-bottom:8px">📍</div>
        <p>暂无位置，点击上方「新建位置」创建</p>
      </div>
    </div>
  </div>

  </div>

</div>

<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="createModalTitle">新建物品</h2>
      <button class="modal-close" onclick="closeModal('createModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editItemId">
      <div class="form-group">
        <label>名称</label>
        <input type="text" id="formName" placeholder="如：大米">
      </div>
      <div class="form-group">
        <label>分类</label>
        <select id="formCategory"></select>
      </div>
      <div class="form-group">
        <label>位置</label>
        <select id="formLocation"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('createModal')">取消</button>
      <button class="btn btn-primary" id="createBtn" onclick="submitItem()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="stockModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="stockModalTitle">入库</h2>
      <button class="modal-close" onclick="closeModal('stockModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="stockItemId">
      <input type="hidden" id="stockAction">
      <div class="form-group">
        <label id="stockQuantityLabel">入库数量</label>
        <input type="number" id="formStockQuantity" min="1" step="1" placeholder="输入数量">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="formStockNote" placeholder="如：本周补货">
      </div>
      <div class="form-group" id="formExpirationGroup">
        <label>到期日期</label>
        <input type="date" id="formExpirationDate" placeholder="如：2027-06-01">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('stockModal')">取消</button>
      <button class="btn btn-primary" id="stockBtn" onclick="submitStock()">确认</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="adjustModal">
  <div class="modal">
    <div class="modal-header">
      <h2>盘点</h2>
      <button class="modal-close" onclick="closeModal('adjustModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="adjustItemId">
      <div class="form-group">
        <label>实际数量</label>
        <input type="number" id="formAdjustQuantity" min="0" step="1" placeholder="盘点后的实际数量">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="formAdjustNote" placeholder="如：实际盘点">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('adjustModal')">取消</button>
      <button class="btn btn-warning" onclick="submitAdjust()">确认盘点</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="nameModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h2 id="nameModalTitle">新建</h2>
      <button class="modal-close" onclick="closeModal('nameModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="nameEditId">
      <input type="hidden" id="nameModalKind">
      <div class="form-group">
        <label id="nameModalLabel">名称</label>
        <input type="text" id="formNameOnly" placeholder="输入名称">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('nameModal')">取消</button>
      <button class="btn btn-primary" id="nameModalBtn" onclick="submitName()">保存</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
const BASE = 'http://127.0.0.1:8080';
let currentPage = 'home';
let currentManageTab = 'items';
let items = [];
let categories = [];
let locations = [];
let selectedItemId = null;
let _detailItem = null;

function api(path, opts = {}) {
  const url = BASE + path;
  return fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...opts.headers },
  }).then(async r => {
    if (!r.ok) {
      const text = await r.text().catch(() => '');
      throw new Error(text || `HTTP ${r.status}`);
    }
    const ct = r.headers.get('content-type') || '';
    if (ct.includes('application/json')) return r.json();
    return r.text();
  });
}

function toast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function esc(s) { return s != null ? String(s).replace(/[&<>"]/g, function(m) {
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
}) : ''; }

function fmtTime(t) {
  if (!t) return '-';
  const d = new Date(t);
  if (isNaN(d)) return t;
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function renderItems() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filterCat = document.getElementById('filterCategory').value;
  const filterLoc = document.getElementById('filterLocation').value;
  let filtered = items;
  if (q) filtered = filtered.filter(i => i.name.toLowerCase().includes(q));
  if (filterCat) filtered = filtered.filter(i => i.category === filterCat);
  if (filterLoc) filtered = filtered.filter(i => i.location === filterLoc);
  const tbody = document.getElementById('itemTableBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('itemCount').textContent = filtered.length + ' 项';
  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = filtered.map(item => {
    const lowStock = item.quantity != null && item.quantity <= 0;
    const cat = esc(item.category || '未分类');
    const loc = esc(item.location || '未设置位置');
    return `<tr onclick="showDetail(${item.id})">
      <td class="cell-title">${esc(item.name)}</td>
      <td class="cell-meta">${cat}</td>
      <td class="cell-meta">${loc}</td>
      <td class="cell-stock${lowStock ? ' low' : ''}">${item.quantity ?? 0}</td>

        <button class="btn btn-warning btn-sm" onclick="event.stopPropagation();showStockOut(${item.id})" ${!item.quantity ? 'disabled' : ''}>出库</button>
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();showAdjust(${item.id})">盘点</button>

  }).join('');

/* ===== Location-Items View ===== */

let _allItems = [];

function loadLocationItems() {
  Promise.all([
    api('/api/items'),
    api('/api/locations'),
  ]).then(([itemsData, locsData]) => {
    _allItems = itemsData;
    locations = locsData;
    const stocked = itemsData.filter(i => i.quantity > 0);
    if (stocked.length === 0) {
      renderLocationItems([]);
      return;
    }
    Promise.all(stocked.map(i => api('/api/items/' + i.id + '/batches').then(batches => {
      i._batches = batches;
      const valid = batches.filter(b => b.quantity > 0 && b.expiration_date);
      i._nearestExp = valid.length ? valid.reduce((a, b) => a.expiration_date < b.expiration_date ? a : b).expiration_date : null;
    }).catch(() => {}))).then(() => renderLocationItems(stocked));
  }).catch(e => toast('加载数据失败: ' + e.message, 'error'));
}

function toggleMovements(itemId) {
  const existing = document.getElementById('mov-row-' + itemId);
  if (existing) {
    existing.remove();
    return;
  }
  const item = _allItems.find(i => i.id === itemId);
  if (!item) return;
  const container = document.getElementById('loc-item-' + itemId);
  if (!container) return;
  const div = document.createElement('div');
  div.id = 'mov-row-' + itemId;
  div.className = 'loc-batch-row';
  div.innerHTML = '<div style="padding:8px 20px;color:var(--text-secondary);font-size:13px">加载中...</div>';
  container.after(div);

  Promise.all([
    api('/api/items/' + itemId + '/movements'),
    api('/api/items/' + itemId + '/batches').catch(() => []),
  ]).then(([movements, batches]) => {
    const typeIcon = { 'stock_in':'📥','stock_out':'📤','adjust':'📝' };
    const typeLabel = { 'stock_in':'入库','stock_out':'出库','adjust':'盘点' };
    let html = '';

    if (movements && movements.length > 0) {
      html += '<div style="font-size:12px;font-weight:600;color:var(--text-secondary);padding:8px 0 4px">最近流水</div>';
      for (const m of movements.slice(0, 8)) {
        const icon = typeIcon[m.type] || '●';
        const qtyClass = m.type === 'stock_in' ? 'up' : m.type === 'stock_out' ? 'down' : 'adjust';
        const qtyLabel = m.type === 'stock_in' ? '+' + m.change : m.type === 'stock_out' ? '-' + Math.abs(m.change) : '' + m.change;
        html += `<div class="mov-row">
          <div class="mov-type">${icon}</div>
          <div class="mov-qty ${qtyClass}">${qtyLabel}</div>
          <div class="mov-note">${esc(m.note || typeLabel[m.type] || m.type)}</div>
          <div class="mov-time">${fmtTime(m.created_at)}</div>
        </div>`;
      }
    }

    if (batches && batches.length > 0) {
      html += '<div style="font-size:12px;font-weight:600;color:var(--text-secondary);padding:8px 0 4px;margin-top:4px">批次明细</div>';
      html += '<table class="batch-table"><thead><tr><th>剩余</th><th>到期日期</th><th>入库时间</th></tr></thead><tbody>';
      for (const b of batches) {
        const expClass = b.expiration_date && b.expiration_date < new Date().toISOString().slice(0,10) ? ' style="color:var(--danger)"' : '';
        html += `<tr><td style="font-weight:600">${b.quantity}</td><td${expClass}>${b.expiration_date ? esc(b.expiration_date) : '无'}</td><td>${fmtTime(b.created_at)}</td></tr>`;
      }
      html += '</tbody></table>';
    }

    if (!html) {
      html = '<div style="padding:8px 20px;color:var(--text-secondary);font-size:13px">暂无数据</div>';
    }
    div.innerHTML = html;
  }).catch(e => {
    div.innerHTML = '<div style="padding:8px 20px;color:var(--danger);font-size:13px">加载失败</div>';
  });
}

function renderLocationItems(stocked) {
  const el = document.getElementById('locationItemsContent');
  if (!stocked) stocked = _allItems.filter(i => i.quantity > 0);
  if (locations.length === 0) {
    el.innerHTML = '<div class="empty"><div style="font-size:40px;color:var(--border);margin-bottom:8px">📍</div><p>暂无场所，请先在「位置」页面添加</p></div>';
    return;
  }
  let html = '';
  for (const loc of locations) {
    const items = stocked.filter(i => i.location === loc.name);
    html += `<div class="card loc-card">
      <div class="card-header">${esc(loc.name)} <span style="font-weight:400;font-size:13px;color:var(--text-secondary)">${items.length} 项</span></div>`;
    if (items.length === 0) {
      html += '<div style="padding:22px 20px;color:var(--text-secondary);font-size:14px">暂无有库存物品</div></div>';
      continue;
    }
    for (const item of items) {
      const expLabel = item._nearestExp ? item._nearestExp : '-';
      const expClass = item._nearestExp && item._nearestExp < new Date().toISOString().slice(0,10) ? 'expired' : '';
      html += `<div class="loc-item-row" id="loc-item-${item.id}">
        <div class="loc-item-name">${esc(item.name)}<div class="loc-item-meta">${esc(item.category || '未分类')} · ${item._batches ? item._batches.length : 0} 个批次</div></div>
        <div class="loc-item-exp ${expClass}">${expLabel}</div>
        <div class="loc-item-qty">${item.quantity}</div>
        <div class="loc-item-actions">
          <button class="btn btn-outline btn-sm" onclick="toggleMovements(${item.id})">流水</button>
          <button class="btn btn-success btn-sm" onclick="showStockIn(${item.id})">入库</button>
          <button class="btn btn-warning btn-sm" onclick="showStockOut(${item.id})">出库</button>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  if (!html) {
    el.innerHTML = '<div class="empty"><div style="font-size:40px;color:var(--border);margin-bottom:8px">📦</div><p>所有场所均无库存物品</p></div>';
    return;
  }
  el.innerHTML = html;
}

/* ===== Shared Name Modal ===== */

function submitName() {
  const id = document.getElementById('nameEditId').value;
  const kind = document.getElementById('nameModalKind').value;
  const name = document.getElementById('formNameOnly').value.trim();
  if (!name) { toast('请输入名称', 'error'); return; }
  const btn = document.getElementById('nameModalBtn');
  btn.disabled = true;

  const path = id ? ('/api/' + kind + '/' + id) : ('/api/' + kind);
  const method = id ? 'PUT' : 'POST';

  api(path, { method, body: JSON.stringify({ name }) }).then(() => {
    toast(kind === 'categories' ? '分类已保存' : '位置已保存');
    closeModal('nameModal');
    if (kind === 'categories') loadCategories();
    else loadLocations();
  }).catch(e => toast('操作失败: ' + e.message, 'error'))
    .finally(() => btn.disabled = false);
}

checkHealth();
loadLocationItems();
loadItems();
loadCategories();
loadLocations();
</script>
